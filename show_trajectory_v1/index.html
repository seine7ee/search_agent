<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轨迹可视化查看器 v1（single_agent / multi_agent）</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1c2129;
    --text-dim: #5a6270;
    --accent: #3859f5;
    --accent-dim: #eef1ff;
    --code-bg: #0f1117;
    --code-text: #d8dee9;
    --ok: #1a8a4a;
    --ok-bg: #e7f7ee;
    --warn: #a86400;
    --warn-bg: #fdf1de;
    --bad: #c22b2b;
    --bad-bg: #fbe9e9;
    --info: #3859f5;
    --info-bg: #eef1ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f26;
      --border: #2c313b;
      --text: #e7e9ee;
      --text-dim: #9aa2b1;
      --accent: #7c93ff;
      --accent-dim: #232a4a;
      --code-bg: #0b0d12;
      --code-text: #d8dee9;
      --ok: #4bd18a;
      --ok-bg: #133224;
      --warn: #e0ab4d;
      --warn-bg: #3a2c10;
      --bad: #ff7373;
      --bad-bg: #3a1717;
      --info: #7c93ff;
      --info-bg: #202544;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  a { color: var(--accent); }
  .layout { display: flex; min-height: 100vh; }
  nav.toc {
    width: 190px;
    flex: none;
    position: sticky;
    top: 0;
    align-self: flex-start;
    height: 100vh;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    padding: 16px 10px;
    background: var(--surface);
  }
  nav.toc h1 { font-size: 14px; margin: 0 8px 12px; }
  nav.toc a {
    display: block;
    padding: 6px 8px;
    border-radius: 6px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
  }
  nav.toc a:hover { background: var(--accent-dim); color: var(--accent); }
  main { flex: 1; min-width: 0; padding: 20px 28px 80px; max-width: 1100px; }

  .topbar {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .topbar input[type="text"] {
    flex: 1;
    min-width: 260px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  button {
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--accent);
  }
  button.tiny {
    padding: 3px 9px;
    font-size: 12px;
    border-radius: 6px;
  }
  button:disabled { opacity: 0.5; cursor: default; }

  #recent { margin-bottom: 18px; }
  #recent summary { cursor: pointer; color: var(--text-dim); font-size: 13px; }
  .recent-list { max-height: 260px; overflow-y: auto; margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; }
  .recent-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 10px;
    font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
  }
  .recent-item:last-child { border-bottom: none; }
  .recent-item:hover { background: var(--accent-dim); color: var(--text); }
  .recent-item .meta { flex: none; color: var(--text-dim); }

  #status { font-size: 13px; margin: 6px 0 18px; min-height: 18px; }
  #status.error { color: var(--bad); }
  #status.ok { color: var(--ok); }

  section { margin-bottom: 34px; scroll-margin-top: 16px; }
  section > h2 {
    font-size: 16px;
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .kv .k { font-size: 11.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
  .kv .v { font-size: 14px; margin-top: 2px; word-break: break-word; }

  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.warn { color: var(--warn); background: var(--warn-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }
  .badge.info { color: var(--info); background: var(--info-bg); }
  .badge.neutral { color: var(--text-dim); background: var(--bg); border: 1px solid var(--border); }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .metric-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .metric-tile .label { font-size: 11.5px; color: var(--text-dim); }
  .metric-tile .value { font-size: 20px; font-weight: 600; margin-top: 2px; }

  details.turn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  details.turn > summary {
    cursor: pointer;
    padding: 12px 14px;
    list-style: none;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  details.turn > summary::-webkit-details-marker { display: none; }
  details.turn > summary::before { content: "▸"; color: var(--text-dim); }
  details.turn[open] > summary::before { content: "▾"; }
  .turn-body { padding: 0 14px 14px; }

  details.block {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin: 10px 0;
    background: var(--bg);
  }
  details.block > summary {
    cursor: pointer;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  details.block > summary::-webkit-details-marker { display: none; }
  details.block > summary::before { content: "▸"; color: var(--text-dim); font-weight: normal; }
  details.block[open] > summary::before { content: "▾"; }
  .block-body { padding: 4px 12px 12px; }

  .msg { border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; background: var(--surface); }
  .msg-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .code-block {
    margin: 0;
    padding: 10px 12px;
    max-height: 380px;
    overflow: auto;
    background: var(--code-bg);
    color: var(--code-text);
    font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    border-radius: 0 0 8px 8px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table th, table td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table th { color: var(--text-dim); font-weight: 600; font-size: 12px; }
  table tr:last-child td { border-bottom: none; }
  .cell-truncate { max-width: 420px; }

  .web-item { border-bottom: 1px solid var(--border); padding: 8px 0; font-size: 13px; }
  .web-item:last-child { border-bottom: none; }
  .web-item .web-title { font-weight: 600; }
  .web-item .web-meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

  .empty-note { color: var(--text-dim); font-size: 13px; padding: 10px 0; }
  .execution-block { border-left: 3px solid var(--accent); padding-left: 12px; margin: 12px 0; }
  .action-chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--accent-dim); color: var(--accent); font-weight: 600; }
  .muted { color: var(--text-dim); }
  .filter-row { margin-bottom: 10px; }
  .filter-row input { width: 260px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 13px; }
  .hint { color: var(--text-dim); font-size: 12.5px; }
</style>
</head>
<body>
  <div class="layout">
    <nav class="toc" id="toc" hidden>
      <h1>轨迹分区</h1>
      <div id="toc-links"></div>
    </nav>
    <main>
      <div class="topbar">
        <input id="path-input" type="text" placeholder="轨迹 JSON 文件路径，例如 deep_search_single_agent/trajectories/traj_xxx.json" autocomplete="off">
        <button id="load-btn">加载</button>
        <button id="expand-all-btn" class="secondary" hidden>全部展开</button>
        <button id="collapse-all-btn" class="secondary" hidden>全部折叠</button>
      </div>
      <details id="recent">
        <summary>最近发现的轨迹文件（点击选择）</summary>
        <div class="recent-list" id="recent-list"><div class="empty-note">加载中…</div></div>
      </details>
      <div id="status"></div>
      <div id="app"></div>
    </main>
  </div>
<script src="/app.js"></script>
</body>
</html>
